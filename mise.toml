[tools]
prek = "latest"

[tasks.build]
description = "Compile the optimized binary"
run = [
  "cargo build --locked --release",
]

[tasks."build:pretty"]
description = "Run standard build with pretty interactive output"
alias = "b"
run = "cargo pretty build"
raw = true

[tasks.install]
description = "Install the checkout's binary on PATH"
alias = "i"
run = "cargo install --path . --locked"

[tasks.fmt]
description = "Format Rust source files"
run = "cargo fmt --all"

[tasks."lint:hooks"]
description = "Check file hygiene, TOML, and Rust formatting with prek"
run = "prek run --all-files"

[tasks."lint:clippy"]
description = "Lint every Rust target and feature with warnings treated as errors"
run = "cargo clippy --all-targets --all-features --locked -- -D warnings"

[tasks."test:rust"]
description = "Run the Rust tests against disposable Git repositories"
run = "cargo test --all-features --locked"

[tasks."test:pretty"]
description = "Run the Rust tests with pretty interactive output"
alias = "t"
run = "cargo pretty test --all-features --locked"
raw = true

[tasks."hooks:install"]
description = "Install the prek pre-commit hook into this clone"
run = "prek install"

[tasks.check]
description = "Run file checks, strict Clippy, and the Rust tests"
alias = "c"
depends = ["lint:*", "test:*"]
